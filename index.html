<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player</title>
<style>
  :root { --bg:#111; --panel:#1c1c1c; --text:#eee; --muted:#999; --accent:#e5484d; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; }
  main { max-width:960px; margin:0 auto; padding:24px 16px 48px; }
  form { display:flex; gap:8px; margin-bottom:16px; }
  input { flex:1; padding:12px; border-radius:8px; border:1px solid #333; background:var(--panel); color:var(--text); font-size:16px; }
  button { padding:12px 20px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-size:16px; cursor:pointer; }
  button.ghost { background:transparent; color:var(--muted); padding:4px 8px; font-size:13px; }
  .frame { position:relative; width:100%; aspect-ratio:16/9; background:#000; border-radius:12px; overflow:hidden; }
  .frame iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
  .empty { display:grid; place-items:center; height:100%; color:var(--muted); }
  #msg { color:#ff8a8a; min-height:1.4em; margin:0 0 8px; font-size:14px; }
  .head { display:flex; justify-content:space-between; align-items:center; margin:28px 0 10px; }
  .head h2 { margin:0; font-size:16px; font-weight:600; }
  #recent { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; }
  #recent button { padding:0; background:var(--panel); border-radius:8px; overflow:hidden; text-align:left; color:var(--text); }
  #recent img { width:100%; display:block; aspect-ratio:16/9; object-fit:cover; }
  #recent span { display:block; padding:6px 8px; font-size:12px; color:var(--muted); }
</style>
</head>
<body>
<main>
  <form id="form">
    <input id="url" placeholder="Paste a YouTube link (video, short, or playlist)" autofocus>
    <button type="submit">Play</button>
  </form>
  <p id="msg"></p>

  <div class="frame" id="frame"><div class="empty">Paste a link above to start watching</div></div>

  <div class="head" id="recentHead" hidden>
    <h2>Recent</h2>
    <button class="ghost" id="clear" type="button">Clear</button>
  </div>
  <div id="recent"></div>
</main>

<script>
  const $ = id => document.getElementById(id);
  const KEY = 'recentVideos';

  function parse(input) {
    input = input.trim();
    if (/^[\w-]{11}$/.test(input)) return { video: input };
    let u;
    try { u = new URL(input); } catch { return null; }
    const list = u.searchParams.get('list');
    let video = u.searchParams.get('v');
    if (!video) {
      const m = u.pathname.match(/^\/(?:embed|shorts|live|v)\/([\w-]{11})/);
      if (m) video = m[1];
      else if (u.hostname === 'youtu.be') video = u.pathname.slice(1, 12);
    }
    if (video && /^[\w-]{11}$/.test(video)) return { video, list };
    if (list) return { list };
    return null;
  }

  function embedUrl({ video, list }) {
    const base = 'https://www.youtube-nocookie.com/embed/' + (video || 'videoseries');
    const p = new URLSearchParams({ autoplay: '1', rel: '0' });
    if (list) p.set('list', list);
    return base + '?' + p;
  }

  function play(target, save = true) {
    $('frame').innerHTML = '';
    const f = document.createElement('iframe');
    f.src = embedUrl(target);
    f.allow = 'autoplay; fullscreen; picture-in-picture; encrypted-media';
    f.allowFullscreen = true;
    f.referrerPolicy = 'strict-origin-when-cross-origin';
    $('frame').appendChild(f);
    if (save && target.video) remember(target);
  }

  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } }
  function store(a) { try { localStorage.setItem(KEY, JSON.stringify(a)); } catch {} }

  function remember(t) {
    const a = load().filter(x => x.video !== t.video);
    a.unshift({ video: t.video, list: t.list || null });
    store(a.slice(0, 12));
    render();
  }

  function render() {
    const a = load();
    $('recentHead').hidden = !a.length;
    $('recent').innerHTML = '';
    a.forEach(t => {
      const b = document.createElement('button');
      b.innerHTML = '<img loading="lazy" alt="" src="https://i.ytimg.com/vi/' + t.video + '/mqdefault.jpg"><span>' + t.video + '</span>';
      b.onclick = () => { $('url').value = 'https://youtu.be/' + t.video; play(t, false); };
      $('recent').appendChild(b);
    });
  }

  $('form').addEventListener('submit', e => {
    e.preventDefault();
    const t = parse($('url').value);
    if (!t) { $('msg').textContent = "Couldn't find a video in that link."; return; }
    $('msg').textContent = '';
    play(t);
  });

  $('clear').onclick = () => { store([]); render(); };

  // Allow ?v=VIDEO_ID or ?url=... on this page's own address
  const q = new URLSearchParams(location.search);
  const initial = q.get('url') || q.get('v');
  if (initial) { $('url').value = initial; const t = parse(initial); if (t) play(t); }

  render();
</script>
</body>
</html>
